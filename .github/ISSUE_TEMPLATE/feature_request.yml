name: 功能请求
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 目前的痛点是什么？这个功能为谁而做？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望怎么实现？涉及哪些页面或模块？
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 主要涉及模块
      options:
        - 数据采集 (data/)
        - 统计分析 (analysis/)
        - 建模 (modeling/)
        - AI Agent (agent/)
        - Web 页面与路由 (app.py / templates/)
        - 部署 (Docker)
        - 其他 / 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 有没有其他实现思路？各自的取舍是什么？

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
          required: false
