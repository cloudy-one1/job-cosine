{% extends "base.html" %}
{% block content %}

<p class="eyebrow">案卷 NO. 03 · 图表分析</p>
<h2 style="margin-bottom:20px;">招聘数据可视化</h2>

<!-- 技能词云 -->
{% if wc_data and wc_data.words and wc_data.words|length > 0 %}
<div class="card" data-no="技能词云" style="margin-bottom:20px;">
    <div style="display:flex; gap:20px; flex-wrap:wrap;">
        <div id="wordcloud_chart" style="flex:2; min-width:400px; height:440px;"></div>
        <div style="flex:1; min-width:200px; max-height:440px; overflow-y:auto; padding:10px 15px; background:#FAF9F5; border-radius:4px; font-size:13px;">
            <h4 style="margin:0 0 10px; color:#1C2620; font-size:14px;">🔥 高频技能 TOP 20</h4>
            <table style="width:100%; border-collapse:collapse;">
                <thead>
                    <tr style="border-bottom:2px solid #D7D9CB;">
                        <th style="text-align:left; padding:4px 8px; color:#5E665A; font-weight:500;">关键词</th>
                        <th style="text-align:right; padding:4px 8px; color:#5E665A; font-weight:500;">出现次数</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in wc_data.words[:20] %}
                    <tr style="border-bottom:1px solid #EDEFE8; {% if loop.first %}font-weight:700; color:#A33B2E;{% endif %}">
                        <td style="padding:3px 8px;">{{ item[0] }}</td>
                        <td style="text-align:right; padding:3px 8px;">{{ item[1] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endif %}

<!-- 薪资分布 -->
<div class="card" data-no="薪资分布">
    <div id="salary_chart" style="width:100%; height:400px;"></div>
</div>

<!-- 学历 + 经验 (并排) -->
<div style="display:flex; gap:20px; margin-top:20px; flex-wrap:wrap;">
    <div class="card" data-no="学历占比" style="flex:1; min-width:280px;">
        <div id="xueli_chart" style="width:100%; height:380px;"></div>
    </div>
    <div class="card" data-no="经验占比" style="flex:1; min-width:280px;">
        <div id="jinyan_chart" style="width:100%; height:380px;"></div>
    </div>
</div>

<!-- 城市分布 -->
<div class="card" data-no="城市分布" style="margin-top:20px;">
    <div id="city_chart" style="width:100%; height:420px;"></div>
</div>

<!-- 交叉分析: 薪资 vs 经验 + 薪资 vs 学历 (并排) -->
<div style="display:flex; gap:20px; margin-top:20px; flex-wrap:wrap;">
    <div class="card" data-no="薪资vs经验" style="flex:1; min-width:380px;">
        <div id="cross_exper_chart" style="width:100%; height:420px;"></div>
    </div>
    <div class="card" data-no="薪资vs学历" style="flex:1; min-width:380px;">
        <div id="cross_edu_chart" style="width:100%; height:420px;"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2.1.0/dist/echarts-wordcloud.min.js"></script>
<script>
// ---------- 主题色 ----------
const COLORS = ['#2E6E5E','#A33B2E','#9C7F3F','#5E665A','#7FA89A','#1C2620','#C9A96E','#8B4A3A'];
const TEXT_COLOR = '#1C2620';
const SOFT_COLOR = '#5E665A';

// 通用 tooltip
const tip = {
    backgroundColor: '#FBFAF6',
    borderColor: '#D7D9CB',
    textStyle: { color: '#1C2620', fontFamily: "'Noto Sans SC',sans-serif", fontSize: 14 },
    extraCssText: 'border-radius:2px; box-shadow:0 4px 12px rgba(0,0,0,.08);'
};

// ---------- 0. 技能词云 ----------
(function(){
    var dom = document.getElementById('wordcloud_chart');
    if(!dom) return;
    var chart = echarts.init(dom);
    {% if wc_data and wc_data.words %}
    var words = {{ wc_data.words|tojson }};
    var data = words.map(function(w){
        return { name: w[0], value: w[1] };
    });
    // 加载中国地图 mask 图片，加载完成后渲染词云
    var maskImg = new Image();
    maskImg.src = "{{ wc_mask_url }}";
    maskImg.onload = function(){
        chart.setOption({
            tooltip: Object.assign({}, tip, {
                formatter: function(p){ return '<b>' + p.name + '</b><br/>出现次数: <b>' + p.value + '</b>'; }
            }),
            series: [{
                type: 'wordCloud',
                maskImage: maskImg,
                sizeRange: [10, 48],
                rotationRange: [-30, 30],
                rotationStep: 15,
                gridSize: 6,
                width: '100%',
                height: '100%',
                drawOutOfBound: false,
                layoutAnimation: true,
                textStyle: {
                    fontFamily: '"Noto Sans SC", sans-serif',
                    fontWeight: 'normal',
                    color: function() {
                        var clrs = ['#2E6E5E','#A33B2E','#9C7F3F','#5E665A','#7FA89A',
                                    '#1C2620','#C9A96E','#8B4A3A','#3A6B7F','#7A4E6B'];
                        return clrs[Math.floor(Math.random() * clrs.length)];
                    }
                },
                emphasis: {
                    textStyle: { fontSize: 32, fontWeight: 'bold' }
                },
                data: data
            }]
        });
    };
    // 如果图片加载失败（如文件不存在），退化为圆形
    maskImg.onerror = function(){
        chart.setOption({
            tooltip: Object.assign({}, tip, {
                formatter: function(p){ return '<b>' + p.name + '</b><br/>出现次数: <b>' + p.value + '</b>'; }
            }),
            series: [{
                type: 'wordCloud',
                shape: 'circle',
                sizeRange: [10, 48],
                rotationRange: [-30, 30],
                rotationStep: 15,
                gridSize: 6,
                width: '100%',
                height: '100%',
                drawOutOfBound: false,
                layoutAnimation: true,
                textStyle: {
                    fontFamily: '"Noto Sans SC", sans-serif',
                    fontWeight: 'normal',
                    color: function() {
                        var clrs = ['#2E6E5E','#A33B2E','#9C7F3F','#5E665A','#7FA89A',
                                    '#1C2620','#C9A96E','#8B4A3A','#3A6B7F','#7A4E6B'];
                        return clrs[Math.floor(Math.random() * clrs.length)];
                    }
                },
                emphasis: {
                    textStyle: { fontSize: 32, fontWeight: 'bold' }
                },
                data: data
            }]
        });
    };
    {% endif %}
    window.addEventListener('resize', function(){ chart.resize(); });
})();

// ---------- 1. 薪资分布柱状图 ----------
(function(){
    var dom = document.getElementById('salary_chart');
    var chart = echarts.init(dom);
    var cats = ['<5k','5-8k','8-11k','11-14k','14-17k','17-20k','20-23k','23k+'];
    var vals = {{ xz|tojson }};
    chart.setOption({
        color: COLORS,
        tooltip: Object.assign({}, tip, {
            formatter: function(p){ return '<b>' + cats[p.dataIndex] + '</b><br/>职位数: <b>' + p.value + '</b>'; }
        }),
        grid: { left: 50, right: 30, top: 60, bottom: 40 },
        xAxis: {
            type: 'category', data: cats,
            axisLine: { lineStyle: { color: '#D7D9CB' } },
            axisTick: { show: false },
            axisLabel: { color: SOFT_COLOR, fontSize: 13 }
        },
        yAxis: {
            type: 'value', name: '职位数',
            nameTextStyle: { color: SOFT_COLOR, fontSize: 12 },
            axisLine: { show: false },
            axisTick: { show: false },
            splitLine: { lineStyle: { color: '#EDEFE8' } },
            axisLabel: { color: SOFT_COLOR, fontSize: 12 }
        },
        series: [{
            type: 'bar', data: vals,
            barWidth: '55%',
            itemStyle: {
                borderRadius: [4,4,0,0],
                color: function(p){
                    return COLORS[p.dataIndex % COLORS.length];
                }
            },
            emphasis: {
                itemStyle: { color: '#A33B2E' }
            },
            label: {
                show: true, position: 'top',
                color: SOFT_COLOR, fontSize: 12, fontWeight: 600
            }
        }]
    });
    window.addEventListener('resize', function(){ chart.resize(); });
})();

// ---------- 2. 学历饼图 ----------
(function(){
    var dom = document.getElementById('xueli_chart');
    var chart = echarts.init(dom);
    var data = {{ xl|tojson }};
    chart.setOption({
        color: COLORS,
        tooltip: Object.assign({}, tip, {
            formatter: function(p){ return '<b>' + p.name + '</b><br/>' + p.value + ' 个职位 (' + p.percent + '%)'; }
        }),
        title: { text: '学历占比', left: 'center', top: 8, textStyle: { fontSize: 16, fontFamily: "'Noto Serif SC',serif", fontWeight: 700, color: TEXT_COLOR } },
        series: [{
            type: 'pie',
            radius: ['0%', '70%'],
            center: ['50%', '55%'],
            data: data.map(function(d){ return { name: d[0], value: d[1] }; }),
            emphasis: {
                itemStyle: { shadowBlur: 12, shadowOffsetX: 0, shadowColor: 'rgba(0,0,0,.2)' },
                label: { fontSize: 16, fontWeight: 'bold' }
            },
            label: {
                color: SOFT_COLOR, fontSize: 12,
                formatter: '{b}\n{d}%'
            },
            labelLine: { length: 10, length2: 8 },
            itemStyle: { borderColor: '#EDEFE8', borderWidth: 2 }
        }]
    });
    window.addEventListener('resize', function(){ chart.resize(); });
})();

// ---------- 3. 经验饼图 ----------
(function(){
    var dom = document.getElementById('jinyan_chart');
    var chart = echarts.init(dom);
    var data = {{ jy|tojson }};
    chart.setOption({
        color: COLORS,
        tooltip: Object.assign({}, tip, {
            formatter: function(p){ return '<b>' + p.name + '</b><br/>' + p.value + ' 个职位 (' + p.percent + '%)'; }
        }),
        title: { text: '经验要求占比', left: 'center', top: 8, textStyle: { fontSize: 16, fontFamily: "'Noto Serif SC',serif", fontWeight: 700, color: TEXT_COLOR } },
        series: [{
            type: 'pie',
            radius: ['0%', '70%'],
            center: ['50%', '55%'],
            data: data.map(function(d){ return { name: d[0], value: d[1] }; }),
            emphasis: {
                itemStyle: { shadowBlur: 12, shadowOffsetX: 0, shadowColor: 'rgba(0,0,0,.2)' },
                label: { fontSize: 16, fontWeight: 'bold' }
            },
            label: {
                color: SOFT_COLOR, fontSize: 12,
                formatter: function(p){
                    return p.percent < 3 ? '' : p.name + '\n' + p.percent + '%';
                }
            },
            labelLine: {
                length: 8, length2: 6,
                showAbove: true
            },
            itemStyle: { borderColor: '#EDEFE8', borderWidth: 2 }
        }]
    });
    window.addEventListener('resize', function(){ chart.resize(); });
})();

// ---------- 4. 城市分布横向柱状图 ----------
(function(){
    var dom = document.getElementById('city_chart');
    var chart = echarts.init(dom);
    var data = {{ city_data|tojson }};
    // data: [[city, count], ...]
    var cities = data.map(function(d){ return d[0]; });
    var counts = data.map(function(d){ return d[1]; });

    chart.setOption({
        color: COLORS,
        tooltip: Object.assign({}, tip, {
            formatter: function(p){ return '<b>' + p.name + '</b><br/>职位数: <b>' + p.value + '</b>'; }
        }),
        grid: { left: 80, right: 50, top: 50, bottom: 20 },
        title: { text: '城市职位数量分布', left: 'center', top: 6, textStyle: { fontSize: 16, fontFamily:"'Noto Serif SC',serif", fontWeight:700, color:TEXT_COLOR } },
        xAxis: {
            type: 'value', name: '职位数',
            nameTextStyle: { color: SOFT_COLOR, fontSize: 12 },
            axisLine: { show: false },
            splitLine: { lineStyle: { color: '#EDEFE8' } },
            axisLabel: { color: SOFT_COLOR, fontSize: 12 }
        },
        yAxis: {
            type: 'category', data: cities.reverse(),
            axisLine: { lineStyle: { color: '#D7D9CB' } },
            axisTick: { show: false },
            axisLabel: { color: TEXT_COLOR, fontSize: 13, fontWeight: 500 },
            inverse: true
        },
        series: [{
            type: 'bar', data: counts.reverse(),
            barWidth: '60%',
            itemStyle: {
                borderRadius: [0,4,4,0],
                color: function(p){
                    return COLORS[p.dataIndex % COLORS.length];
                }
            },
            label: {
                show: true, position: 'right',
                color: SOFT_COLOR, fontSize: 12, fontWeight: 600
            }
        }]
    });
    window.addEventListener('resize', function(){ chart.resize(); });
})();

// ---------- 5. 薪资 vs 经验 交叉分析 ----------
(function(){
    var dom = document.getElementById('cross_exper_chart');
    if(!dom) return;
    var chart = echarts.init(dom);
    var data = {{ cross_exper|tojson }};
    chart.setOption({
        color: ['#2E6E5E','#A33B2E','#9C7F3F'],
        tooltip: Object.assign({}, tip, {
            formatter: function(p){
                if(p.seriesName==='职位数') return '<b>'+p.name+'</b><br/>职位数: <b>'+p.value+'</b>';
                return '<b>'+p.name+'</b><br/>平均薪资: <b>'+p.value+'k</b>';
            }
        }),
        title: { text: '薪资 vs 经验等级', left: 'center', top: 4, textStyle: { fontSize:16, fontFamily:"'Noto Serif SC',serif", fontWeight:700, color:TEXT_COLOR } },
        legend: { data:['职位数','平均薪资(k)'], bottom: 4, textStyle:{color:SOFT_COLOR,fontSize:12} },
        grid: { left: 50, right: 50, top: 55, bottom: 40 },
        xAxis: {
            type: 'category', data: data.labels,
            axisLine: { lineStyle:{color:'#D7D9CB'} },
            axisTick: { show:false },
            axisLabel: { color:SOFT_COLOR, fontSize:12 }
        },
        yAxis: [
            { type: 'value', name: '职位数', nameTextStyle:{color:SOFT_COLOR,fontSize:12}, axisLine:{show:false},
              splitLine:{lineStyle:{color:'#EDEFE8'}}, axisLabel:{color:SOFT_COLOR,fontSize:12} },
            { type: 'value', name: '薪资(k)', nameTextStyle:{color:SOFT_COLOR,fontSize:12}, axisLine:{show:false},
              splitLine:{show:false}, axisLabel:{color:SOFT_COLOR,fontSize:12} }
        ],
        series: [
            {
                name: '职位数', type: 'bar', data: data.counts, yAxisIndex: 0,
                barWidth: '50%', itemStyle: { borderRadius:[4,4,0,0], color: '#2E6E5E' },
                label: { show:true, position:'top', color:SOFT_COLOR, fontSize:11 }
            },
            {
                name: '平均薪资(k)', type: 'line', data: data.avg_salaries, yAxisIndex: 1,
                smooth: true, lineStyle: { width:3, color:'#A33B2E' },
                itemStyle: { color:'#A33B2E' },
                symbol: 'circle', symbolSize: 8,
                label: { show:true, color:'#A33B2E', fontSize:11, fontWeight:600 }
            }
        ]
    });
    window.addEventListener('resize',function(){ chart.resize(); });
})();

// ---------- 6. 薪资 vs 学历 交叉分析 ----------
(function(){
    var dom = document.getElementById('cross_edu_chart');
    if(!dom) return;
    var chart = echarts.init(dom);
    var data = {{ cross_edu|tojson }};
    chart.setOption({
        color: ['#2E6E5E','#A33B2E','#9C7F3F'],
        tooltip: Object.assign({}, tip, {
            formatter: function(p){
                if(p.seriesName==='职位数') return '<b>'+p.name+'</b><br/>职位数: <b>'+p.value+'</b>';
                return '<b>'+p.name+'</b><br/>平均薪资: <b>'+p.value+'k</b>';
            }
        }),
        title: { text: '薪资 vs 学历', left: 'center', top: 4, textStyle: { fontSize:16, fontFamily:"'Noto Serif SC',serif", fontWeight:700, color:TEXT_COLOR } },
        legend: { data:['职位数','平均薪资(k)'], bottom: 4, textStyle:{color:SOFT_COLOR,fontSize:12} },
        grid: { left: 50, right: 50, top: 55, bottom: 40 },
        xAxis: {
            type: 'category', data: data.labels,
            axisLine: { lineStyle:{color:'#D7D9CB'} },
            axisTick: { show:false },
            axisLabel: { color:SOFT_COLOR, fontSize:12 }
        },
        yAxis: [
            { type: 'value', name: '职位数', nameTextStyle:{color:SOFT_COLOR,fontSize:12}, axisLine:{show:false},
              splitLine:{lineStyle:{color:'#EDEFE8'}}, axisLabel:{color:SOFT_COLOR,fontSize:12} },
            { type: 'value', name: '薪资(k)', nameTextStyle:{color:SOFT_COLOR,fontSize:12}, axisLine:{show:false},
              splitLine:{show:false}, axisLabel:{color:SOFT_COLOR,fontSize:12} }
        ],
        series: [
            {
                name: '职位数', type: 'bar', data: data.counts, yAxisIndex: 0,
                barWidth: '50%', itemStyle: { borderRadius:[4,4,0,0], color: '#2E6E5E' },
                label: { show:true, position:'top', color:SOFT_COLOR, fontSize:11 }
            },
            {
                name: '平均薪资(k)', type: 'line', data: data.avg_salaries, yAxisIndex: 1,
                smooth: true, lineStyle: { width:3, color:'#A33B2E' },
                itemStyle: { color:'#A33B2E' },
                symbol: 'circle', symbolSize: 8,
                label: { show:true, color:'#A33B2E', fontSize:11, fontWeight:600 }
            }
        ]
    });
    window.addEventListener('resize',function(){ chart.resize(); });
})();
</script>

{% endblock %}
